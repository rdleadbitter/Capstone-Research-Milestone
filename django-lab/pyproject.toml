[project]
name = "django-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]